version: "3.8"

services:
  api:
    build: ./api
    container_name: solance_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-solanceresidences@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-solanceresidences@gmail.com}
      - TO_EMAIL=${TO_EMAIL:-solanceresidences@gmail.com}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - solance_network

  nginx:
    image: nginx:alpine
    container_name: solance_nginx
    ports:
      - "3007:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - solance_network

networks:
  solance_network:
    driver: bridge
